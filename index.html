<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CET-4 词条速测 · 4500 词</title>
<style>
:root{--bg:#17171a;--card:#202024;--line:#2e2e34;--fg:#f2f2f4;--dim:#8b8b93;--red:#e4002b;--ok:#1db954;--no:#ff4d4f}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
     display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:520px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{margin:0 0 4px;font-size:18px;color:var(--red)}
.hero{background:#000;margin:-20px -20px 16px;padding:22px 18px 18px;border-radius:13px 13px 0 0;text-align:center}
.hero h1{margin:0;font-size:31px;font-weight:800;color:var(--red);letter-spacing:2px;line-height:1.3;text-shadow:0 0 18px rgba(228,0,43,.35)}
.hero .sub{margin:9px 0 0;font-size:12px;color:#8b8b93}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px}
select,input{width:100%;padding:9px 10px;background:#2a2a30;border:1px solid var(--line);border-radius:9px;
             color:var(--fg);font-size:14px;font-family:inherit}
button{font-family:inherit;cursor:pointer}
.go{margin-top:18px;width:100%;padding:13px;background:var(--red);border:0;border-radius:10px;color:#fff;
    font-size:15px;font-weight:600}
.go:hover{filter:brightness(1.1)}
.bar{height:6px;background:#2a2a30;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--red);transition:width .2s;width:0}
.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:14px}
.prompt{text-align:center;padding:16px 8px 18px}
.prompt .w{font-size:32px;font-weight:700;letter-spacing:.5px;word-break:break-word;line-height:1.25}
.prompt .p{color:var(--dim);font-size:13px;margin-top:8px;min-height:18px}
.wrow{display:flex;align-items:center;justify-content:center;gap:10px}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#2a2a30;
     color:var(--fg);font-size:17px;line-height:1}
.say:hover{border-color:var(--red);color:var(--red)}
.autosay{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);margin-top:14px}
.autosay input{width:auto;height:auto;margin:0}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#2a2a30;border:1px solid var(--line);
     border-radius:10px;color:var(--fg);font-size:14px;text-align:left;line-height:1.35}
.opt:hover{border-color:#4a4a55}
.opt k{color:var(--dim);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:none}
.opt.ok{background:#10361f;border-color:var(--ok)}
.opt.no{background:#3a1214;border-color:var(--no)}
.opt[disabled]{cursor:default}
.done{text-align:center}
.done .big{font-size:44px;font-weight:700}
.done .tag{display:inline-block;margin:10px 0;padding:5px 12px;border-radius:99px;font-size:13px}
.tag.pass{background:#10361f;color:#5fe08a}
.tag.fail{background:#3a1214;color:#ff8a8c}
.wrongs{text-align:left;margin:16px 0 0;max-height:240px;overflow:auto;font-size:13px}
.wrongs div{padding:7px 0;border-bottom:1px solid var(--line)}
.wrongs b{margin-right:6px}
.hint{color:var(--dim);font-size:11px;text-align:center;margin-top:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;color:var(--dim)}
.link{background:none;border:0;color:var(--dim);font-size:12px;padding:2px 0;cursor:pointer}
.link:hover{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">

  <div id="setup" class="card">
    <div class="hero">
      <h1>小伙子来测下你英语</h1>
      <div class="sub">CET-4 词条速测 · 四级大纲 4500 词 · 选对就下一个 · 答错的会再问你一次 · 点 🔊 听发音</div>
    </div>
    <label>模式</label>
    <select id="mode">
      <option value="read">看英文 → 选中文（认读）</option>
      <option value="write">看中文 → 选英文（产出）</option>
    </select>
    <label>出题顺序</label>
    <select id="order">
      <option value="hard" selected>难度序：先难后易（长词·生僻词优先）</option>
      <option value="freq">词频序：先易后难（高频词优先）</option>
    </select>
    <label class="autosay"><input id="bygrp" type="checkbox" onchange="toggleGrp()"> 按分组练习（每组 15 词、按原始顺序）</label>
    <div id="grpbox">
      <label>每组多少词（共 <span id="gtotal">300</span> 组）</label>
      <input id="gsize" type="number" value="15" min="5" max="150" onchange="buildGroups()">
      <label>第几组（✅ = 已做完）</label>
      <select id="group" onchange="showPos()"></select>
      <div class="hint" style="text-align:left;margin-top:6px">每 15 词 = 300 组（做 300 天）；想正好 30 组就把上面改成 150</div>
    </div>
    <label>范围</label>
    <select id="limit" onchange="showPos()">
      <option value="120">前 120 词</option>
      <option value="360" selected>前 360 词</option>
      <option value="840">前 840 词</option>
      <option value="1440">前 1440 词</option>
      <option value="3000">前 3000 词（全部计划）</option>
      <option value="4500">全部 4500</option>
    </select>
    <label>这一组多少题</label>
    <input id="count" type="number" value="30" min="5" max="200">
    <label class="autosay"><input id="wrongonly" type="checkbox" onchange="showPos()"> 只考错过的词（错题本 <span id="wcount">0</span> 词）</label>
    <label class="autosay"><input id="autosay" type="checkbox" checked> 出题时自动读一遍</label>
    <button class="go" onclick="start()">开始</button>
    <div class="hint" id="posinfo"></div>
  </div>

  <div id="quiz" class="card" hidden>
    <div class="qhead"><span id="qmode"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="stat"><span id="left"></span><span id="right"></span></div>
    <div class="prompt"><div class="wrow"><span class="w" id="promptWord"></span><button class="say" id="say" title="读一遍（快捷键 S）">🔊</button></div><div class="p" id="promptSub"></div></div>
    <div class="opts" id="opts"></div>
    <div class="hint" id="khint">键盘 1–4 选择 · S 发音</div>
    <button class="go" style="background:#2a2a30;margin-top:10px" onclick="backToSetup()">首页（放弃本组）</button>
  </div>

  <div id="done" class="card done" hidden>
    <div class="big" id="score"></div>
    <div class="tag" id="verdict"></div>
    <div class="sub" id="detail"></div>
    <div class="wrongs" id="wrongs"></div>
    <button class="go" id="nextgrp" hidden onclick="nextGroup()">下一组 →</button>
    <button class="go" onclick="start()">再背一组</button>
    <button class="go" style="background:#2a2a30;margin-top:8px" onclick="startWrong()">只练错词</button>
    <button class="go" style="background:#2a2a30;margin-top:8px" onclick="backToSetup()">首页</button>
    <button class="go" style="background:#2a2a30;margin-top:8px" onclick="resetPos()">重置进度</button>
  </div>

</div>

  while (out.length < 4 && bag.length && guard-- > 0){
    const c = bag[Math.floor(Math.random() * bag.length)];
    if (!out.some(o => o[2] === c[2])) out.push(c);
  }
  return out.sort(() => Math.random() - 0.5);
}

// ---- 发音：用浏览器自带语音（无需联网/音频文件）----
let voice = null;
function pickVoice(){
  if (typeof speechSynthesis === 'undefined' || !speechSynthesis.getVoices) return;
  const vs = speechSynthesis.getVoices() || [];
  voice = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.addEventListener)
  speechSynthesis.addEventListener('voiceschanged', pickVoice);

function say(text){
  if (typeof speechSynthesis === 'undefined' || !text) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

// ---- 错题本：答错进、答对出，存本地 ----
function wrongSet(){
  try { return new Set(JSON.parse(LS.get('en4500_wrong', '[]'))); }
  catch (e) { return new Set(); }
}
function saveWrong(set){ LS.set('en4500_wrong', JSON.stringify([...set])); }
function startWrong(){ $('#wrongonly').checked = true; start(); }

// ---- 分组：4500 词按原始顺序切块，做完自动打勾 ----
const KEY_GDONE = 'en4500_gdone';
function gdoneSet(){
  try { return new Set(JSON.parse(LS.get(KEY_GDONE, '[]'))); }
  catch (e) { return new Set(); }
}
function saveGdone(s){ LS.set(KEY_GDONE, JSON.stringify([...s])); }
const grpSize = () => Math.max(5, Math.min(150, +$('#gsize').value || 15));
const grpTotal = () => Math.ceil(DATA.length / grpSize());
function buildGroups(){
  const sel = $('#group'); if (!sel) return;
  const size = grpSize(), total = grpTotal(), done = gdoneSet(), cur = sel.value;
  sel.innerHTML = '';
  for (let i = 1; i <= total; i++){
    const a = (i - 1) * size + 1, b = Math.min(i * size, DATA.length);
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = '第 ' + i + ' 组（第 ' + a + '–' + b + ' 词）' + (done.has(size + ':' + i) ? ' ✅' : '');
    sel.appendChild(o);
  }
  if (cur && +cur <= total) sel.value = cur;
  if ($('#gtotal')) $('#gtotal').textContent = String(total);
  showPos();
}
function toggleGrp(){
  const on = $('#bygrp').checked;
  $('#grpbox').hidden = !on;
  $('#limit').disabled = on;      // 分组时范围/顺序由分组决定
  $('#order').disabled = on;
  $('#count').disabled = on;
  if (on) buildGroups();
  showPos();
}
function nextGroup(){
  const sel = $('#group'), n = Math.min(+sel.value + 1, sel.children.length);
  sel.value = String(n);
  start();
}

function start(){
  const isWrong = $('#wrongonly').checked;
  const byGrp = !isWrong && $('#bygrp').checked;
  const gsize = grpSize(), gnum = byGrp ? +($('#group').value || 1) : 0;
  const gStart = byGrp ? (gnum - 1) * gsize : 0;
  const gEnd = byGrp ? Math.min(gnum * gsize, DATA.length) : 0;
  const count = byGrp ? Math.max(1, gEnd - gStart)
              : Math.max(5, Math.min(200, +$('#count').value || 30));
  const book = wrongSet();
  const poolAll = isWrong ? DATA.filter(x => book.has(x[0]))
                 : byGrp ? DATA.slice(gStart, gEnd)
                 : DATA.slice(0, +$('#limit').value);
  if (isWrong && !poolAll.length){
    alert('错题本还是空的。先正常做几组，答错的词会自动进这里。');
    return;
  }
  const order = byGrp ? 'freq' : $('#order').value;   // 分组练习走原始顺序
  const seq = seqOf(poolAll, order);
  let idx = (isWrong || byGrp) ? 0 : +(LS.get(KEY_POS + order, 0));
  if (idx >= seq.length) idx = 0;                       // 走完一圈从头再来
  const initial = seq.slice(idx, Math.min(idx + count, seq.length)).map(x => ({ w: x, turn: 1 }));
  const modeName = $('#mode').value === 'read' ? '认读' : '产出';
  if ($('#qmode')) $('#qmode').textContent = byGrp
    ? '第 ' + gnum + ' 组（第 ' + (gStart + 1) + '–' + gEnd + ' 词） · ' + modeName
    : (order === 'hard' ? '难度序' : '词频序') + ' · ' + modeName + ' · 前 ' + poolAll.length + ' 词';
  S = { isWrong, byGrp, gnum, gsize, count, order, seqLen: seq.length, initial: initial.length, poolAll, mode: $('#mode').value,
        queue: initial.slice(), fresh: 0, done: 0, wrong: [], startIdx: idx, locked: false };
  $('#setup').hidden = true; $('#done').hidden = true; $('#quiz').hidden = false;
  next();
}

function next(){
  if (!S.queue.length) return finish();
  const q = S.queue[0], w = q.w, mode = S.mode;
  if (!q.counted){ q.counted = true; S.done++; }   // 同一词只计一次（重问不计）
  $('#promptWord').textContent = mode === 'read' ? w[0] : w[2];
  $('#promptSub').textContent = mode === 'read' ? '' : '选出对应的英文单词';
  if (mode === 'read' && $('#autosay').checked) say(w[0]);      // 认读：出题就读
  const opts = makeOptions(w, S.poolAll, DATA);
  const box = $('#opts'); box.innerHTML = '';
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.w = o[0];
    b.innerHTML = '<k>' + (i + 1) + '</k><span>' + (mode === 'read' ? o[2] : o[0]) + '</span>';
    b.onclick = () => answer(o[0] === w[0], b, w);
    box.appendChild(b);
  });
  paint();
}

function answer(ok, btn, w){
  if (S.locked) return;
  S.locked = true;
  const q = S.queue[0];
  if (S.mode === 'write') say(w[0]);      // 产出：作答后才读（作答前读等于报答案）
  if (ok){
    btn.classList.add('ok');
    if (q.turn === 1){                                  // 只统计「第一次就答对」
      S.fresh++;
      const ws = wrongSet();                            // 练会了就移出错题本
      if (ws.delete(w[0])) saveWrong(ws);
    }
    S.queue.shift();
    setTimeout(() => { S.locked = false; next(); }, 220);          // 选对 → 下一个
  } else {
    btn.classList.add('no');
    const right = [...$('#opts').children].find(b => b.dataset.w === w[0]);
    if (right) right.classList.add('ok');
    if (q.turn === 1){
      S.wrong.push(w);
      const ws = wrongSet(); ws.add(w[0]); saveWrong(ws);   // 答错 → 进错题本
    }
    S.queue.shift();
    S.queue.push({ w: w, turn: q.turn + 1, counted: true });        // 答错的排到队尾再问
    setTimeout(() => { S.locked = false; next(); }, 1100);
  }
}

function paint(){
  $('#prog').style.width = (S.done / S.initial * 100) + '%';
  $('#left').textContent = '剩 ' + (S.initial - S.done + 1) + ' 题 · 队列 ' + S.queue.length;
  $('#right').textContent = '首次答对 ' + S.fresh + ' / ' + S.done;
}

function finish(){
  const acc = S.done ? Math.round(S.fresh / S.done * 100) : 0;
  if (S.byGrp){                                       // 整组走完 → 打勾
    const d = gdoneSet(); d.add(S.gsize + ':' + S.gnum); saveGdone(d);
  } else if (!S.isWrong) LS.set(KEY_POS + S.order, String(Math.min(S.startIdx + S.done, S.seqLen)));
  if ($('#nextgrp')) $('#nextgrp').hidden = !(S.byGrp && S.gnum < grpTotal());
  $('#quiz').hidden = true;
  $('#done').hidden = false;
  $('#score').textContent = acc + '%';
  const pass = acc >= 85;
  const v = $('#verdict');
  v.className = 'tag ' + (pass ? 'pass' : 'fail');
  v.textContent = pass ? '达标（≥85%）' : (acc >= 70 ? '接近，下周多磨错词' : '未达标（<70%）→ 停新卡一周');
  $('#detail').textContent = '首次答对 ' + S.fresh + ' / ' + S.done + ' · 错词 ' + S.wrong.length + ' 个';
  $('#wrongs').innerHTML = S.wrong.length
    ? S.wrong.map((w, i) => '<div><b>' + (i + 1) + '.</b><b>' + w[0] + '</b> [' + w[1] + '] ' + w[2] + '</div>').join('')
    : '<div style="color:#8b8b93">全对，没有错词。</div>';
  showPos();
}

function backToSetup(){
  // 中途返回：把已答的进度存下（done 含当前这道未答的，所以减 1）
  if (S && !S.isWrong && !S.byGrp && S.done) LS.set(KEY_POS + S.order, String(Math.min(S.startIdx + Math.max(0, S.done - 1), S.seqLen)));
  S = null;
  $('#quiz').hidden = true;
  $('#done').hidden = true;
  $('#setup').hidden = false;
  showPos();
}

function resetPos(){ LS.set(KEY_POS + $('#order').value, '0'); showPos(); alert('进度已重置到第 1 词'); }

function showPos(){
  const n = wrongSet().size;
  const isWrong = $('#wrongonly').checked;
  if ($('#wcount')) $('#wcount').textContent = n;
  if ($('#bygrp') && $('#bygrp').checked && !isWrong){
    const size = grpSize(), total = grpTotal(), g = +($('#group').value || 1);
    const a = (g - 1) * size + 1, b = Math.min(g * size, DATA.length);
    $('#posinfo').textContent = '分组模式：第 ' + g + ' / ' + total + ' 组（第 ' + a + '–' + b + ' 词）· 已完成 ' + gdoneSet().size + ' 组 · 错题本 ' + n + ' 词';
    return;
  }
  const pool = isWrong ? n : +$('#limit').value;
  const p = +(LS.get(KEY_POS + $('#order').value, 0));
  $('#posinfo').textContent = '当前进度：第 ' + (p + 1) + ' 词起 · 共 ' + pool + ' 词 · 错题本 ' + n + ' 词';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S && !$('#quiz').hidden) finish(); return; }
  if (!S || S.locked || $('#quiz').hidden) return;
  if (e.key === 's' || e.key === 'S'){ const t = curWord(); if (t) say(t); return; }
  const n = +e.key;
  if (n >= 1 && n <= 4){ const b = $('#opts').children[n - 1]; if (b && b.onclick) b.onclick(); }
});

const curWord = () => (S && S.queue[0] ? S.queue[0].w[0] : '');
if ($('#say')) $('#say').onclick = () => { const t = curWord(); if (t) say(t); };

buildGroups();
showPos();
if ($('#khint')) $('#khint').textContent = isTouchDevice()
  ? '点选项作答 · 点 🔊 听发音'
  : '键盘 1–4 选择 · S 发音';

// 预览用：?demo=1 直接开一组；&pick=wrong 额外演示「选错」反馈
const qs = new URLSearchParams(location.search);
if (qs.has('demo')){
  $('#limit').value = qs.get('limit') || '360';
  $('#count').value = qs.get('count') || '30';
  $('#mode').value = qs.get('mode') || 'read';
  $('#order').value = qs.get('order') || 'hard';
  start();
  if (qs.get('pick') === 'wrong'){
    const w = $('#promptWord').textContent;
    const b = [...$('#opts').children].find(x => x.dataset.w !== w);
    if (b) b.onclick();
  }
}
</script>
</body>
